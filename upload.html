 <!DOCTYPE html> <html lang="ar" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>إيداع ورفع مستند جديد - ثانوية الكسائي</title> <script src="https://cdn.tailwindcss.com"></script> <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet"> <script src="https://unpkg.com/lucide@latest"></script> <style> body { font-family: 'IBM Plex Sans Arabic', sans-serif; } </style> </head> <body class="bg-[#f8f9ff] text-slate-800 antialiased min-h-screen flex flex-col"> <header class="bg-white border-b border-slate-200 px-6 py-3.5 flex items-center justify-between"> <div class="flex items-center gap-3"> <a href="index.html" class="w-10 h-10 rounded-xl bg-blue-900 flex items-center justify-center text-white"> <i data-lucide="graduation-cap" class="w-6 h-6"></i> </a> <div> <h1 class="font-bold text-lg text-blue-950">إيداع مستند رقمي جديد (PDF)</h1> <p class="text-xs text-slate-500">ربط الملفات بالأرشيف المركزي لثانوية الكسائي</p> </div> </div> <a href="index.html" class="text-xs font-semibold text-slate-600 hover:text-slate-900">العودة للرئيسية</a> </header> <main class="max-w-4xl mx-auto p-6 md:p-8 flex-1 w-full"> <div class="bg-white rounded-2xl border border-slate-200 p-8 shadow-sm"> <h2 class="text-lg font-bold text-slate-900 mb-6 flex items-center gap-2"> <i data-lucide="file-up" class="w-5 h-5 text-blue-900"></i> بطاقة بيانات الوثيقة وتحديد المجلد </h2> <form class="space-y-6" onsubmit="event.preventDefault(); alert('تم استلام الوثيقة وحفظها بنجاح!');"> <!-- منطقة السحب والإفلات --> <div class="border-2 border-dashed border-blue-200 bg-blue-50/50 rounded-2xl p-8 text-center hover:bg-blue-50 transition cursor-pointer"> <div class="w-12 h-12 rounded-full bg-blue-100 text-blue-900 flex items-center justify-center mx-auto mb-3"> <i data-lucide="cloud-upload" class="w-6 h-6"></i> </div> <h3 class="font-bold text-slate-800 text-sm mb-1">اسحب ملف PDF هنا أو انقر لاختياره من جهازك</h3> <p class="text-xs text-slate-400">يدعم صيغ PDF فقط بحد أقصى يصل إلى 50 ميجابايت للملف الواحد</p> <input type="file" accept=".pdf" class="hidden" id="fileInput"> </div> <div class="grid grid-cols-1 md:grid-cols-2 gap-4"> <div> <label class="block text-xs font-semibold text-slate-700 mb-1.5">اسم الوثيقة / العنوان الرسمي *</label> <input type="text" value="التقرير السنوي الشامل لأداء ثانوية الكسائي 2024" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-900"> </div> <div> <label class="block text-xs font-semibold text-slate-700 mb-1.5">المجلد الوجهة بالأرشيف *</label> <select class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-900"> <option>مجلد التنظيم والتخطيط</option> <option>مجلد الوثائق والتعاميم</option> <option>مجلد الشؤون التعليمية والمتابعة</option> <option>مجلد شؤون الطلاب</option> <option>مجلد الاجتماعات واللجان</option> </select> </div> </div> <div> <label class="block text-xs font-semibold text-slate-700 mb-1.5">ملاحظات أو وصف توثيقي مختصر</label> <textarea rows="3" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-900" placeholder="يتضمن التقرير مخرجات الامتحانات الفصلية ونسب النجاح..."></textarea> </div> <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3"> <a href="index.html" class="px-5 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50">إلغاء</a> <button type="submit" class="px-6 py-2.5 rounded-xl bg-blue-900 text-white text-xs font-semibold hover:bg-blue-800 transition shadow-sm flex items-center gap-1.5"> <i data-lucide="check" class="w-4 h-4"></i> بدء رفع وحفظ المستند </button> </div> </form> </div> </main> <script> lucide.createIcons(); </script> </body> </html>
