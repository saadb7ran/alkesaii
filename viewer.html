<!DOCTYPE html> <html lang="ar" dir="rtl"> <head <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>مستعرض وقارئ ملفات PDF - ثانوية الكسائي</title> <script src="https://cdn.tailwindcss.com"></script> <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet"> <script src="https://unpkg.com/lucide@latest"></script> <style> body { font-family: 'IBM Plex Sans Arabic', sans-serif; } </style> </head> <body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col"> <!-- شريط التحكم العلوي للمستعرض --> <header class="bg-slate-950 border-b border-slate-800 sticky top-0 z-30 px-4 md:px-6 py-3 flex items-center justify-between shadow-lg"> <div class="flex items-center gap-3"> <!-- زر العودة الذكي --> <a id="backBtn" href="./files.html" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl transition flex items-center gap-1 font-semibold text-xs"> <i data-lucide="arrow-right" class="w-4 h-4 text-blue-400"></i> <span class="hidden sm:inline" id="backLabel">العودة</span> </a> <div class="h-6 w-[1px] bg-slate-800"></div> <div class="flex items-center gap-2"> <span class="text-xs font-bold bg-red-600 text-white px-2 py-0.5 rounded">PDF</span> <h1 id="viewerDocTitle" class="font-bold text-sm md:text-base text-white truncate max-w-[200px] sm:max-w-md">جاري فتح ملف الـ PDF...</h1> </div> </div> <!-- إجراءات التحميل والطباعة وفتح بنافذة جديدة --> <div class="flex items-center gap-2"> <a id="openNewTabBtn" href="#" target="_blank" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-semibold transition hidden sm:flex items-center gap-1.5"> <i data-lucide="external-link" class="w-3.5 h-3.5"></i> <span>نافذة كاملة</span> </a> <button onclick="downloadActivePdf()" class="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-bold transition flex items-center gap-1.5 shadow-md"> <i data-lucide="download" class="w-4 h-4"></i> <span>تحميل الملف</span> </button> </div> </header> <!-- شريط البيانات المصغر --> <div class="bg-slate-950/80 border-b border-slate-800 px-6 py-2 flex flex-wrap items-center justify-between text-xs text-slate-400 gap-2"> <div class="flex items-center gap-3"> <span class="flex items-center gap-1 text-slate-300"> <i data-lucide="folder" class="w-3.5 h-3.5 text-blue-400"></i> <span id="folderBadge" class="font-semibold text-blue-300">...</span> </span> <span>•</span> <span id="authorText">ثانوية الكسائي</span> <span>•</span> <span id="dateText">معتمد</span> </div> <div class="flex items-center gap-1.5 text-emerald-400 font-medium"> <i data-lucide="shield-check" class="w-4 h-4"></i> <span>نسخة موثقة ومحمية بالأرشيف</span> </div> </div> <!-- مساحة العرض الرئيسية: ملف الـ PDF الحقيقي --> <main class="flex-1 flex flex-col p-2 md:p-4 w-full h-[calc(100vh-105px)]"> <!-- إطار عرض الـ PDF الحقيقي --> <div id="pdfViewerWrapper" class="flex-1 w-full bg-slate-800 rounded-xl overflow-hidden border border-slate-700 shadow-2xl relative"> <iframe id="pdfFrame" src="" class="w-full h-full border-none"></iframe> <!-- شاشة تحميل الـ PDF --> <div id="loadingOverlay" class="absolute inset-0 bg-slate-900 flex flex-col items-center justify-center space-y-3 z-20"> <div class="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div> <p class="text-sm font-semibold text-slate-300">جاري استرجاع وعرض ملف الـ PDF الأصلي...</p> </div> <!-- في حال كان الملف من النماذج التوضيحية الافتراضية الأولية فقط --> <div id="mockDocNotice" class="hidden absolute bottom-4 left-1/2 -translate-x-1/2 bg-blue-950/90 border border-blue-700 px-4 py-2 rounded-xl text-xs text-blue-200 text-center shadow-lg z-10"> 💡 هذا الملف نموذج توضيحي أولي افتراضي للموقع، بينما أي ملف جديد ترفعه من جهازك سيظهر بنسخته الأصلية الكاملة. </div> </div> </main> <script> lucide.createIcons(); // فتح مخزن IndexedDB function openFileDatabase() { return new Promise((resolve, reject) => { const req = indexedDB.open('AlkisaeePdfStorage', 1); req.onupgradeneeded = function(e) { const db = e.target.result; if (!db.objectStoreNames.contains('pdfFiles')) { db.createObjectStore('pdfFiles', { keyPath: 'id' }); } }; req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error); }); } async function getPdfBlob(docId) { const db = await openFileDatabase(); return new Promise((resolve) => { const tx = db.transaction('pdfFiles', 'readonly'); const store = tx.objectStore('pdfFiles'); const req = store.get(docId); req.onsuccess = () => resolve(req.result ? req.result.blob : null); req.onerror = () => resolve(null); }); } const folderMap = { 'planning': 'مجلد التنظيم والتخطيط', 'circulars': 'مجلد الوثائق والتعاميم', 'academic': 'مجلد الشؤون التعليمية والمتابعة', 'students': 'مجلد شؤون الطلاب', 'committees': 'مجلد الاجتماعات واللجان' }; // قراءة الرابط والمستند المطلوب const urlParams = new URLSearchParams(window.location.search); const fileParam = urlParams.get('file') || ''; const isVisitor = urlParams.get('role') === 'visitor'; // ضبط زر الرجوع const backBtn = document.getElementById('backBtn'); const backLabel = document.getElementById('backLabel'); if (isVisitor) { backBtn.href = './visitor.html'; backLabel.textContent = 'العودة لبوابة الزوار'; } else { backBtn.href = './files.html'; backLabel.textContent = 'العودة للملفات'; } let activeObjectUrl = null; let activeDocTitle = 'وثيقة_مدرسية'; async function loadPdfViewer() { let docsList = []; try { docsList = JSON.parse(localStorage.getItem('alkisaee_all_documents')) || []; } catch(e) {} // البحث عن الملف const doc = docsList.find(d => d.title === decodeURIComponent(fileParam) || d.id === fileParam); if (doc) { activeDocTitle = doc.title; document.title = doc.title + ' - ثانوية الكسائي'; document.getElementById('viewerDocTitle').textContent = doc.title; document.getElementById('folderBadge').textContent = folderMap[doc.folder] || 'الأرشيف المدرسي'; document.getElementById('authorText').textContent = doc.author || 'ثانوية الكسائي'; document.getElementById('dateText').textContent = doc.date || 'معتمد'; // محاولة جلب ملف الـ PDF الحقيقي من IndexedDB let blob = await getPdfBlob(doc.id); if (blob) { // ملف PDF حقيقي تم رفعه activeObjectUrl = URL.createObjectURL(blob); displayPdfUrl(activeObjectUrl); } else { // في حال عدم توفر Blob، نعرض ملف PDF رسمي مطابق يحتوي على بياناته generateDynamicPdfView(doc); } } else { // ملف افتراضي من الرابط المباشر activeDocTitle = decodeURIComponent(fileParam) || 'وثيقة رسمية'; document.getElementById('viewerDocTitle').textContent = activeDocTitle; generateDynamicPdfView({ title: activeDocTitle, folder: 'planning', author: 'إدارة ثانوية الكسائي', date: 'معتمد' }); } } function displayPdfUrl(url) { const frame = document.getElementById('pdfFrame'); frame.src = url; document.getElementById('openNewTabBtn').href = url; frame.onload = () => { document.getElementById('loadingOverlay').classList.add('hidden'); }; setTimeout(() => { document.getElementById('loadingOverlay').classList.add('hidden'); }, 1000); } function generateDynamicPdfView(doc) { // توليد ملف PDF/HTML تفاعلي رسمي إذا كان الملف أولي بدون Blob document.getElementById('mockDocNotice').classList.remove('hidden'); const htmlContent = ` <!DOCTYPE html> <html lang="ar" dir="rtl"> <head> <meta charset="UTF-8"> <script src="https://cdn.tailwindcss.com"><\/script> <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet"> <style>body { font-family: 'IBM Plex Sans Arabic', sans-serif; background: #525659; padding: 20px; }</style> </head> <body class="flex justify-center"> <div class="bg-white text-slate-800 max-w-3xl w-full p-12 rounded-lg shadow-2xl min-h-[900px] flex flex-col justify-between"> <div> <div class="flex justify-between items-start border-b-2 border-slate-800 pb-6 mb-8"> <div> <h3 class="font-bold text-sm">المملكة العربية السعودية</h3> <p class="text-xs text-slate-600">وزارة التعليم</p> <p class="text-xs font-bold text-blue-900 mt-1">ثانوية الكسائي</p> </div> <div class="text-center font-bold text-blue-950 text-xs bg-blue-50 px-3 py-1.5 rounded-lg border border-blue-200"> الأرشيف المركزي المعتمد </div> <div class="text-left text-xs font-mono text-slate-600 dir-ltr"> <p>التاريخ: ${doc.date || '1446هـ'}</p> <p>الرمز: ${doc.code || 'KIS-2025'}</p> </div> </div> <div class="text-center my-12"> <span class="text-xs bg-blue-100 text-blue-900 px-3 py-1 rounded-full font-semibold">وثيقة رسمية</span> <h1 class="text-2xl font-extrabold text-blue-950 mt-4 mb-2">${doc.title}</h1> <p class="text-xs text-slate-500">${doc.author || 'إدارة المدرسة'}</p> </div> <div class="bg-slate-50 p-6 rounded-xl border border-slate-200 text-xs leading-relaxed text-slate-700 space-y-3"> <h4 class="font-bold text-blue-950 text-sm">بيان الاعتماد والتوثيق:</h4> <p>${doc.notes || 'تم حفظ وأرشفة هذه الوثيقة وفق اللوائح التنظيمية المعتمدة لثانوية الكسائي وتعتبر سارية المفعول ومعتمدة رسمياً.'}</p> </div> </div> <div class="border-t border-slate-200 pt-6 flex justify-between items-center text-xs text-slate-600"> <div> <p class="font-bold">المسؤول: ${doc.author || 'إدارة المدرسة'}</p> </div> <div class="w-20 h-20 rounded-full border-2 border-dashed border-blue-900 flex items-center justify-center text-[10px] text-blue-900 font-bold rotate-[-6deg]"> ختم الاعتماد </div> <div> <p class="font-bold">مدير ثانوية الكسائي</p> <p class="text-[11px] text-slate-400">معتمد إلكترونياً</p> </div> </div> </div> </body> </html> `; const blob = new Blob([htmlContent], { type: 'text/html' }); activeObjectUrl = URL.createObjectURL(blob); displayPdfUrl(activeObjectUrl); } function downloadActivePdf() { if (activeObjectUrl) { const a = document.createElement('a'); a.href = activeObjectUrl; a.download = activeDocTitle + '.pdf'; a.click(); } } loadPdfViewer(); </script> </body> </html>
