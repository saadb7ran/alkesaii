<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستعرض ملفات PDF - ثانوية الكسائي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'IBM Plex Sans Arabic', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col m-0 p-0 overflow-hidden">

    <!-- شريط التحكم العلوي النقي -->
    <header class="bg-slate-950 border-b border-slate-800 px-4 md:px-6 py-2.5 flex items-center justify-between z-20 shadow-md">
        <div class="flex items-center gap-3">
            <a id="backBtn" href="./files.html" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg transition flex items-center gap-1 text-xs font-semibold">
                <i data-lucide="arrow-right" class="w-4 h-4 text-blue-400"></i>
                <span id="backText">العودة للملفات</span>
            </a>
            <div class="h-5 w-[1px] bg-slate-700"></div>
            <div class="flex items-center gap-2">
                <span class="text-[11px] font-bold bg-red-600 text-white px-2 py-0.5 rounded">PDF</span>
                <h1 id="pdfHeaderTitle" class="font-bold text-xs md:text-sm text-white truncate max-w-xs md:max-w-md">جاري فتح الملف...</h1>
            </div>
        </div>
        
        <!-- أزرار الإجراءات الحقيقية -->
        <div class="flex items-center gap-2">
            <button onclick="downloadRealPdf()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-bold transition flex items-center gap-1.5 shadow">
                <i data-lucide="download" class="w-3.5 h-3.5"></i>
                <span>تحميل الملف الأصلي</span>
            </button>
        </div>
    </header>

    <!-- مساحة العرض الكاملة: ملف الـ PDF الحقيقي فقط -->
    <main class="flex-1 w-full h-[calc(100vh-53px)] bg-slate-800 relative">
        <!-- إطار الـ PDF الأصلي -->
        <iframe id="mainPdfFrame" class="w-full h-full border-none" src=""></iframe>

        <!-- شاشة انتظار بسيطة أثناء تحميل الـ PDF -->
        <div id="loader" class="absolute inset-0 bg-slate-900 flex flex-col items-center justify-center space-y-3 z-10">
            <div class="w-9 h-9 border-3 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-xs text-slate-400 font-medium">جاري فتح ملف الـ PDF الحقيقي...</p>
        </div>

        <!-- تنبيه عند عدم وجود ملف مرفوع -->
        <div id="noPdfFound" class="hidden absolute inset-0 bg-slate-900 flex flex-col items-center justify-center space-y-4 p-6 text-center z-20">
            <div class="w-16 h-16 rounded-2xl bg-red-950/50 border border-red-800 text-red-400 flex items-center justify-center">
                <i data-lucide="file-x" class="w-8 h-8"></i>
            </div>
            <div class="space-y-1 max-w-sm">
                <h3 class="font-bold text-white text-base">لم يتم العثور على ملف PDF مرفوع</h3>
                <p class="text-xs text-slate-400">يبدو أن هذا الملف تم إنشاؤه مسبقاً قبل تفعيل خاصية تخزين ملفات الـ PDF الأصلية.</p>
            </div>
            <a href="./upload.html" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-xl transition flex items-center gap-2">
                <i data-lucide="upload" class="w-4 h-4"></i>
                رفع ملف PDF جديد الآن
            </a>
        </div>
    </main>

    <script>
        lucide.createIcons();

        // 1. إدارة التخزين المستقر للملفات الكبيرة IndexedDB
        function getDb() {
            return new Promise((resolve) => {
                const req = indexedDB.open('AlkisaeeDirectStorage', 2);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('rawPdfs')) {
                        db.createObjectStore('rawPdfs', { keyPath: 'id' });
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => resolve(null);
            });
        }

        async function loadStoredPdfBlob(id) {
            const db = await getDb();
            if (!db) return null;
            return new Promise((resolve) => {
                try {
                    const tx = db.transaction('rawPdfs', 'readonly');
                    const store = tx.objectStore('rawPdfs');
                    const req = store.get(id);
                    req.onsuccess = () => resolve(req.result ? req.result.fileData : null);
                    req.onerror = () => resolve(null);
                } catch(e) {
                    resolve(null);
                }
            });
        }

        // 2. قراءة معرّف أو عنوان الملف المطلوب
        const urlParams = new URLSearchParams(window.location.search);
        const fileTitleParam = decodeURIComponent(urlParams.get('file') || '');
        const isVisitor = urlParams.get('role') === 'visitor';

        const backBtn = document.getElementById('backBtn');
        const backText = document.getElementById('backText');
        if (isVisitor) {
            backBtn.href = './visitor.html';
            backText.textContent = 'العودة لبوابة الزوار';
        } else {
            backBtn.href = './files.html';
            backText.textContent = 'العودة للملفات';
        }

        let globalPdfUrl = null;
        let globalDownloadName = 'document.pdf';

        async function initViewer() {
            let docs = [];
            try {
                docs = JSON.parse(localStorage.getItem('alkisaee_all_documents')) || [];
            } catch(e) {}

            // البحث عن المستند
            const doc = docs.find(d => d.title === fileTitleParam || d.id === fileTitleParam);

            if (!doc) {
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('noPdfFound').classList.remove('hidden');
                return;
            }

            globalDownloadName = doc.title + '.pdf';
            document.title = doc.title + ' - ثانوية الكسائي';
            document.getElementById('pdfHeaderTitle').textContent = doc.title;

            // أ) محاولة جلب الملف الفعلي من قاعدة البيانات
            let rawData = await loadStoredPdfBlob(doc.id);

            // ب) إذا لم يوجد في IndexedDB، نفحص إذا كان مخزناً داخل كائن المستند نفسه
            if (!rawData && doc.pdfBase64) {
                rawData = doc.pdfBase64;
            }

            if (rawData) {
                if (typeof rawData === 'string') {
                    // Data URL
                    globalPdfUrl = rawData;
                } else if (rawData instanceof Blob || rawData instanceof File) {
                    globalPdfUrl = URL.createObjectURL(rawData);
                }

                const iframe = document.getElementById('mainPdfFrame');
                iframe.src = globalPdfUrl;

                iframe.onload = () => {
                    document.getElementById('loader').classList.add('hidden');
                };

                setTimeout(() => {
                    document.getElementById('loader').classList.add('hidden');
                }, 800);
            } else {
                // لا يوجد ملف PDF حقيقي مخزن لهذا السجل
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('noPdfFound').classList.remove('hidden');
            }
        }

        function downloadRealPdf() {
            if (!globalPdfUrl) return;
            const a = document.createElement('a');
            a.href = globalPdfUrl;
            a.download = globalDownloadName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        initViewer();
    </script>
</body>
</html>
